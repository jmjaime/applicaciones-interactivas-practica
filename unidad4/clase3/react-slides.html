<h3 id="recordatorio-%C2%BFqu%C3%A9-es-prop-drilling"><strong>Recordatorio: ¿Qué es prop drilling?</strong></h3>
<p>Pasar props a través de componentes intermedios que no las necesitan:</p>

  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Dashboard</span> <span class="hljs-attr">user</span>=<span class="hljs-string">{user}</span> /&gt;</span></span>;
}

<span class="hljs-keyword">function</span> <span class="hljs-title function_">Dashboard</span>(<span class="hljs-params">{ user }</span>) {

}

<h2 id="%C2%BFpor-qu%C3%A9-es-un-problema">¿Por qué es un problema?</h2>
<h3 id="problemas-del-prop-drilling"><strong>Problemas del prop drilling</strong>:</h3>
<ol>
<li><strong>Acoplamiento innecesario</strong>: Componentes intermedios dependen de props que no usan</li>
<li><strong>Mantenimiento difícil</strong>: Cambiar la estructura de datos requiere actualizar múltiples archivos</li>
<li><strong>Código verboso</strong>: Mucha repetición de código</li>
<li><strong>Dificulta refactoring</strong>: Mover componentes implica actualizar toda la cadena</li>
</ol>
<h3 id="%C2%BFcu%C3%A1ndo-es-prop-drilling-aceptable"><strong>¿Cuándo es prop drilling aceptable?</strong></h3>
<ul>
<li><strong>1-2 niveles de profundidad</strong>: Es simple y claro</li>
<li><strong>Componentes fuertemente relacionados</strong>: Tiene sentido semántico</li>
</ul>
</section>

<h2 id="la-soluci%C3%B3n-context-api">La solución: Context API</h2>
<h3 id="%C2%BFqu%C3%A9-es-context-api"><strong>¿Qué es Context API?</strong></h3>
<p>Context API permite <strong>compartir datos entre componentes</strong> sin pasar props manualmente a través de cada nivel del árbol de componentes.</p>
<p><strong>Analogía</strong>: Como tener Wi-Fi en toda la casa</p>
<ul>
<li><strong>Sin Context</strong>: Cables ethernet desde el router hasta cada dispositivo</li>
<li><strong>Con Context</strong>: Todos los dispositivos se conectan directamente al Wi-Fi</li>
</ul>
</section>

<h2 id="context-api-conceptos-clave">Context API: Conceptos clave</h2>
<h3 id="react-context-tiene-3-partes"><strong>React Context tiene 3 partes</strong>:</h3>
<ol>
<li><strong>Crear el Context</strong> (<code>createContext()</code>)</li>
<li><strong>Proveer el valor</strong> (Provider Component)</li>
<li><strong>Consumir el valor</strong> (<code>useContext()</code> o <code>use()</code>)</li>
</ol>
<p><strong>Flujo de trabajo</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Crear Context → 2. Proveer valor → 3. Consumir en componentes hijos
</code></pre>
</section>

<h2 id="%C2%BFcu%C3%A1ndo-usar-context">¿Cuándo usar Context?</h2>
<h3 id="%E2%9C%85-usa-context-para"><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Usa Context para</strong>:</h3>
<ul>
<li><strong>Datos globales</strong>: Usuario autenticado, tema, idioma</li>
<li><strong>Estado compartido</strong>: Carrito de compras, favoritos</li>
<li><strong>Configuración</strong>: Settings de la app</li>
<li><strong>Prop drilling profundo</strong>: 3+ niveles de componentes</li>
</ul>
<h3 id="%E2%9D%8C-no-uses-context-para"><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> NO uses Context para</strong>:</h3>
<ul>
<li><strong>Datos locales</strong>: Estado que solo usa un componente</li>
<li><strong>Props de 1-2 niveles</strong>: Prop drilling simple es más claro</li>
<li><strong>Datos que cambian muy frecuentemente</strong>: Puede causar re-renders excesivos</li>
<li><strong>Reemplazo completo de state management</strong>: Para casos complejos considera Redux/Zustand</li>
</ul>
</section>

<li>Transiciones de estado <strong>predecibles</strong></li>
</ul>
<p><strong>Analogía</strong>: Como Redux pero local a un componente</p>

<h2 id="buenas-pr%C3%A1cticas-con-context">Buenas prácticas con Context</h2>
<h3 id="%E2%9C%85-recomendaciones"><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Recomendaciones</strong>:</h3>
<ol>
<li><strong>Un Context por preocupación</strong>: Separa temas, auth, datos, etc.</li>
<li><strong>Provider Components</strong>: Encapsula lógica en un componente provider</li>
<li><strong>Valores memoizados</strong>: Usa <code>useMemo</code> para objetos grandes</li>
<li><strong>TypeScript</strong>: Define tipos para el contexto</li>
<li><strong>Valores por defecto</strong>: Incluye valores iniciales útiles</li>
</ol>
<h3 id="%E2%9D%8C-evitar"><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Evitar</strong>:</h3>
<ol>
<li><strong>Context para todo</strong>: No reemplaces props locales</li>
<li><strong>Demasiados contextos anidados</strong>: Máximo 3-4 niveles</li>
<li><strong>Actualizaciones frecuentes</strong>: Considera state management libraries</li>
<li><strong>Lógica compleja en consumers</strong>: Mantén componentes simples</li>
</ol>
</section>

<h2 id="%C2%BFqu%C3%A9-son-los-custom-hooks">¿Qué son los Custom Hooks?</h2>
<h3 id="definici%C3%B3n"><strong>Definición</strong></h3>
<p>Custom Hooks son <strong>funciones JavaScript</strong> que permiten extraer y reutilizar lógica con estado entre componentes.</p>
<p><strong>Características</strong>:</p>
<ol>
<li>Nombre empieza con <code>use</code> (ej: <code>useLocalStorage</code>, <code>useFetch</code>)</li>
<li>Pueden llamar a otros Hooks (built-in o custom)</li>
<li>NO retornan JSX (si lo hacen, son componentes)</li>
<li>Encapsulan lógica reutilizable</li>
</ol>
<p><strong><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f511.svg" data-marp-twemoji=""/> Clave</strong>: Es una función normal, pero React la trata especialmente por empezar con <code>use</code></p>
</section>

    <span class="hljs-keyword">const</span> saved = <span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">getItem</span>(<span class="hljs-string">&quot;todos&quot;</span>);

<h2 id="custom-hooks-vs-componentes">Custom Hooks vs Componentes</h2>
<table>
<thead>
<tr>
<th>Custom Hooks</th>
<th>Componentes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Lógica reutilizable</td>
<td>UI reutilizable</td>
</tr>
<tr>
<td>No retorna JSX</td>
<td>Retorna JSX</td>
</tr>
<tr>
<td>Usa otros hooks</td>
<td>Usa hooks</td>
</tr>
<tr>
<td><code>useNombre()</code></td>
<td><code>&lt;Nombre /&gt;</code></td>
</tr>
<tr>
<td>Retorna datos/funciones</td>
<td>Retorna elementos</td>
</tr>
</tbody>
</table>
<p><strong>Regla</strong>: Si retorna solo JSX → Componente. Si retorna datos/lógica → Hook</p>
</section>

<h2 id="buenas-pr%C3%A1cticas-con-custom-hooks">Buenas prácticas con Custom Hooks</h2>
<h3 id="%E2%9C%85-hacer"><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Hacer</strong>:</h3>
<ol>
<li><strong>Un propósito por hook</strong>: <code>useFetch</code>, no <code>useEverything</code></li>
<li><strong>Nombres descriptivos</strong>: <code>useLocalStorage</code>, no <code>useLS</code></li>
<li><strong>Parámetros claros</strong>: Documentar qué recibe y retorna</li>
<li><strong>Carpeta dedicada</strong>: <code>/hooks</code> en tu proyecto</li>
<li><strong>Tests</strong>: Son funciones puras, fáciles de testear</li>
</ol>
<h3 id="%E2%9D%8C-evitar-1"><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Evitar</strong>:</h3>
<ol>
<li><strong>Hooks muy generales</strong>: Difíciles de entender</li>
<li><strong>Demasiada lógica</strong>: Considerar dividir</li>
<li><strong>Efectos ocultos</strong>: Documentar side effects</li>
</ol>
</section>

<h3 id="el-problema-react-es-single-page-application-spa"><strong>El problema: React es Single Page Application (SPA)</strong></h3>
<p>Por defecto, React solo renderiza una página:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">App</span>(<span class="hljs-params"></span>) {

}
</code></pre>
<p><strong>¿Cómo muestro diferentes &quot;páginas&quot;?</strong></p>
<ul>
<li><code>/</code> → Home</li>
<li><code>/about</code> → About</li>
<li><code>/products</code> → Products</li>
<li><code>/products/123</code> → Product Detail</li>
</ul>

<h2 id="single-page-vs-multi-page-applications">Single Page vs Multi Page Applications</h2>
<h3 id="multi-page-application-mpa---tradicional"><strong>Multi-Page Application (MPA) - Tradicional</strong></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Usuario click → Navegador hace HTTP request
→ Servidor envía HTML nuevo → Página recarga
</code></pre>
<p><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Problemas</strong>: Recarga completa, pérdida de estado, más lento</p>
<h3 id="single-page-application-spa---react"><strong>Single Page Application (SPA) - React</strong></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Usuario click → JavaScript cambia URL → React renderiza nuevo componente
→ Sin recarga, instantáneo
</code></pre>
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Ventajas</strong>: Rápido, mantiene estado, mejor UX</p>
</section>

<h2 id="react-router-la-soluci%C3%B3n">React Router: La solución</h2>
<p><strong>React Router</strong> es una librería que permite:</p>
<ol>
<li><strong>Definir rutas</strong>: Asociar URLs con componentes</li>
<li><strong>Navegación</strong>: Links sin recargar la página</li>
<li><strong>Parámetros</strong>: URLs dinámicas (<code>/products/:id</code>)</li>
<li><strong>Rutas anidadas</strong>: Layouts compartidos</li>
<li><strong>Programmatic navigation</strong>: Navegar desde código</li>
</ol>
<p><strong><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f511.svg" data-marp-twemoji=""/> Es el estándar</strong> para routing en React</p>

<h2 id="index-routes-la-ruta-por-defecto">Index Routes: La ruta &quot;por defecto&quot;</h2>
<h3 id="%C2%BFqu%C3%A9-es-index"><strong>¿Qué es <code>index</code>?</strong></h3>
<p>Una <strong>Index Route</strong> es la ruta que se renderiza cuando visitas exactamente la URL del padre.</p>
<p><strong>Sin <code>path</code></strong>: No tiene su propia URL, usa la del padre.</p>
<p><strong>Ejemplo básico</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx">&lt;<span class="hljs-title class_">Route</span> path=<span class="hljs-string">&quot;/&quot;</span> element={<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Layout</span> /&gt;</span></span>}&gt;
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Route</span> <span class="hljs-attr">index</span> <span class="hljs-attr">element</span>=<span class="hljs-string">{</span>&lt;<span class="hljs-attr">HomePage</span> /&gt;</span>} /&gt;</span>
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Route</span> <span class="hljs-attr">path</span>=<span class="hljs-string">&quot;about&quot;</span> <span class="hljs-attr">element</span>=<span class="hljs-string">{</span>&lt;<span class="hljs-attr">AboutPage</span> /&gt;</span>} /&gt;</span>
&lt;/<span class="hljs-title class_">Route</span>&gt;
</code></pre>
<p><strong>URLs resultantes</strong>:</p>
<ul>
<li><code>/</code> → Renderiza <code>&lt;HomePage /&gt;</code> dentro del <code>&lt;Outlet /&gt;</code> de Layout</li>
<li><code>/about</code> → Renderiza <code>&lt;AboutPage /&gt;</code> dentro del <code>&lt;Outlet /&gt;</code> de Layout</li>
</ul>
</section>

<h2 id="la-soluci%C3%B3n-loader-functions">La solución: Loader Functions</h2>
<h3 id="%C2%BFqu%C3%A9-son-los-loaders"><strong>¿Qué son los loaders?</strong></h3>
<p>React Router v6.4+ permite definir <strong>funciones loader</strong> que cargan datos <strong>antes</strong> de renderizar el componente.</p>
<p><strong>Ventajas</strong>:</p>
<ul>
<li>Datos disponibles antes del render</li>
<li>No necesitas <code>useState</code>, <code>useEffect</code>, ni estado de loading</li>
<li>Código más limpio y declarativo</li>
<li>Manejo de errores centralizado</li>
</ul>

<h2 id="buenas-pr%C3%A1cticas-con-loaders">Buenas prácticas con loaders</h2>
<h3 id="%E2%9C%85-hacer-2"><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Hacer</strong>:</h3>
<ol>
<li><strong>Exportar loaders</strong> del componente para mejor organización</li>
<li><strong>Throw errores</strong> en loaders para activar errorElement</li>
<li><strong>Usar TypeScript</strong>: Tipado de loader data para type safety</li>
<li><strong>Organizar en carpetas</strong>: <code>/pages</code> o <code>/routes</code> con sus loaders</li>

</ol>
<h3 id="%E2%9D%8C-evitar-3"><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Evitar</strong>:</h3>
<ol>
<li><strong>Lógica de negocio</strong> en loaders (usar services/API layer)</li>
<li><strong>Loaders que modifican datos</strong>: Los loaders son solo para lectura</li>
<li><strong>Fetch manual en componentes</strong>: Usa loaders en su lugar</li>
<li><strong>No manejar errores</strong>: Siempre incluir errorElement</li>
</ol>
