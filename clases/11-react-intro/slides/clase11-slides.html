<h2 id="%C2%BFqu%C3%A9-es-react">¿Qué es React?</h2>
<blockquote>
<p>&quot;The library for web and native user interfaces.&quot; — <a href="https://react.dev/">react.dev</a></p>
</blockquote>
<ul>
<li>Una <strong>librería</strong> de JavaScript para construir interfaces, no un framework completo: no trae router, ni fetch, ni formularios. Eso se suma aparte, más adelante.</li>
<li>Creada en Facebook (2013), open source. La usan Meta, Netflix, Airbnb, MercadoLibre.</li>
<li>Dos ideas centrales:
<ol>
<li>La UI se arma con <strong>componentes</strong>: funciones reutilizables.</li>
<li>Se describe <strong>cómo se ve la UI para un estado dado</strong>; React se encarga de actualizar el DOM.</li>
</ol>
</li>
</ul>

b" stroke-width="2.5" /><text x="1025" y="110" font-size="22" fill="#50fa7b" font-weight="bold" text-anchor="middle" dominant-baseline="middle">DOM</text><text x="1025" y="138" font-size="16" fill="#f8f8f2" text-anchor="middle" dominant-baseline="middle">solo cambios</text><line x1="180" y1="120" x2="236" y2="120" stroke="#6272a4" stroke-width="2.5" marker-end="url(#r)" /><line x1="440" y1="110" x2="496" y2="62" stroke="#6272a4" stroke-width="2.5" marker-end="url(#r)" /><line x1="700" y1="55" x2="756" y2="105" stroke="#6272a4" stroke-width="2.5" marker-end="url(#r)" /><line x1="700" y1="185" x2="756" y2="135" stroke="#6272a4" stroke-width="2.5" marker-end="url(#r)" /><line x1="900" y1="120" x2="956" y2="120" stroke="#6272a4" stroke-width="2.5" marker-end="url(#r)" /><text x="600" y="252" font-size="17" fill="#f8f8f2" text-anchor="middle">objetos JS en memoria: compararlos es barato</text></svg></p>
<ul>
<li>Se escribe como en la clase pasada: <strong>describir toda la pantalla</strong> a partir del estado.</li>
<li>React compara el resultado con el anterior (<strong>reconciliación</strong>) y aplica al DOM <strong>solo la diferencia</strong>.</li>
<li>Ese árbol de objetos en memoria es lo que suele llamarse <strong>Virtual DOM</strong>.</li>
</ul>

<p><svg viewBox="0 0 1100 230" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Roboto, sans-serif" style="display:block;width:100%;max-height:200px;margin:0.2em auto"><defs><marker id="vd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6272a4" /></marker></defs><g font-family="Fira Code, monospace" font-size="19"><rect x="10" y="40" width="300" height="150" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="2" /><text x="160" y="28" text-anchor="middle" fill="#bd93f9" font-family="Inter, sans-serif" font-size="20" font-weight="bold">árbol anterior</text><text x="30" y="80" fill="#f8f8f2">article.card</text><text x="50" y="120" fill="#f8f8f2">h2 &quot;Depto Palermo&quot;</text><text x="50" y="160" fill="#f8f8f2">button.fav</text><rect x="370" y="40" width="300" height="150" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="2" /><text x="520" y="28" text-anchor="middle" fill="#bd93f9" font-family="Inter, sans-serif" font-size="20" font-weight="bold">árbol nuevo</text><text x="390" y="80" fill="#f8f8f2">article.card</text><text x="410" y="120" fill="#f8f8f2">h2 &quot;Depto Palermo&quot;</text><rect x="400" y="138" width="240" height="32" rx="6" fill="none" stroke="#ff79c6" stroke-width="2" /><text x="410" y="160" fill="#ff79c6">button.fav.activo</text><rect x="780" y="40" width="310" height="150" rx="10" fill="#21222c" stroke="#50fa7b" stroke-width="2" /><text x="935" y="28" text-anchor="middle" fill="#50fa7b" font-family="Inter, sans-serif" font-size="20" font-weight="bold">DOM real</text><text x="800" y="105" fill="#f8f8f2">button.classList</text><text x="820" y="140" fill="#f8f8f2">.add(&quot;activo&quot;)</text></g><line x1="672" y1="115" x2="776" y2="115" stroke="#6272a4" stroke-width="3" marker-end="url(#vd)" /><text x="724" y="105" text-anchor="middle" fill="#f1fa8c" font-size="18">diff</text><text x="550" y="222" text-anchor="middle" fill="#6272a4" font-size="18">Virtual DOM: objetos JS en memoria · DOM real: lo que dibuja el navegador (caro)</text></svg></p>
<ol>
<li><strong>Disparo</strong>: el click cambia el estado, igual que en la clase pasada.</li>
<li><strong>Render</strong>: React vuelve a ejecutar los componentes y describe <strong>toda</strong> la pantalla de nuevo, como <code>render()</code>.</li>
<li><strong>Commit</strong>: en vez de <code>replaceChildren</code>, compara los dos árboles y toca el DOM <strong>solo donde cambió</strong>.</li>
</ol>
<p>Renderizar no es redibujar: un componente puede ejecutarse sin que cambie nada en pantalla.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">Card</span>(<span class="hljs-params">{ propiedad }</span>) {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">// Lo que se escribe</span>
<span class="hljs-keyword">const</span> titulo = <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">className</span>=<span class="hljs-string">&quot;titulo&quot;</span>&gt;</span>Propiedades<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span></span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// Lo que llega al navegador, después de transpilar</span>
<span class="hljs-keyword">import</span> { jsx } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react/jsx-runtime&quot;</span>;
<span class="hljs-keyword">const</span> titulo = <span class="hljs-title function_">jsx</span>(<span class="hljs-string">&quot;h1&quot;</span>, { <span class="hljs-attr">className</span>: <span class="hljs-string">&quot;titulo&quot;</span>, <span class="hljs-attr">children</span>: <span class="hljs-string">&quot;Propiedades&quot;</span> });

</code></pre>
<ul>
<li>Hace falta un paso de <strong>transpilación</strong> (JSX y TypeScript → JS): lo hace <strong>Vite</strong>.</li>
<li>El resultado de un JSX es un <strong>objeto común</strong>, no un nodo del DOM. Por eso compararlos es barato.</li>

<h2 id="reglas-de-jsx-22">Reglas de JSX (2/2)</h2>
<table>
<thead>
<tr>
<th>HTML</th>
<th>JSX</th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>class=&quot;card&quot;</code></td>
<td><code>className=&quot;card&quot;</code></td>
<td><code>class</code> es palabra reservada de JS</td>
</tr>
<tr>
<td><code>for=&quot;nombre&quot;</code></td>
<td><code>htmlFor=&quot;nombre&quot;</code></td>
<td>Ídem <code>for</code></td>
</tr>
<tr>
<td><code>onclick=&quot;…&quot;</code></td>
<td><code>onClick={…}</code></td>
<td>Atributos en <strong>camelCase</strong>, y se pasa una función, no un string</td>
</tr>
<tr>
<td><code>tabindex</code>, <code>maxlength</code></td>
<td><code>tabIndex</code>, <code>maxLength</code></td>
<td>camelCase</td>
</tr>
<tr>
<td><code>style=&quot;font-size: 2rem&quot;</code></td>
<td><code>style={{ fontSize: &quot;2rem&quot; }}</code></td>
<td>Un <strong>objeto</strong> JS, propiedades en camelCase</td>
</tr>
</tbody>
</table>
<p>Los <code>data-*</code> y <code>aria-*</code> se escriben igual que en HTML.</p>
</section>

<h2 id="jsx-escapa-por-defecto">JSX escapa por defecto</h2>
<ul>
<li>Se ve <code>&lt;b&gt;Excelente&lt;/b&gt; atención</code>, literal: React inserta los valores como <strong>texto</strong>, igual que <code>textContent</code>.</li>
<li>Con JS plano había que acordarse de no usar <code>innerHTML</code> con datos del usuario. En React, lo seguro es el <strong>default</strong>.</li>
<li>La escapatoria existe y tiene un nombre que asusta a propósito: <code>dangerouslySetInnerHTML</code>.</li>
</ul>
</section>

<h2 id="componentes">Componentes</h2>
<p>Un <strong>componente</strong> es una función que devuelve JSX:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">Header</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">header</span> <span class="hljs-attr">className</span>=<span class="hljs-string">&quot;header&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">strong</span>&gt;</span><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3e0.svg" data-marp-twemoji=""/> Inmobi<span class="hljs-tag">&lt;/<span class="hljs-name">strong</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">header</span>&gt;</span></span>
  );
}
</code></pre>
<ul>
<li>Nombre en <strong>PascalCase</strong>: <code>&lt;Header /&gt;</code> es un componente, <code>&lt;header&gt;</code> es HTML.</li>
<li>Se usa como si fuera una etiqueta, y se puede repetir y anidar.</li>
<li>Encapsula estructura <strong>y</strong> comportamiento: es la unidad de reutilización.</li>
</ul>

<h2 id="may%C3%BAscula--componente">Mayúscula = componente</h2>
<ul>
<li>Con minúscula, JSX lo trata como <strong>etiqueta HTML</strong>: crea un <code>&lt;card&gt;</code> vacío que el navegador no conoce. Nada de &quot;Casa con pileta&quot;.</li>
<li>La Console avisa: <code>The tag &lt;card&gt; is unrecognized in this browser</code>.</li>
<li>Regla: <strong>los componentes siempre empiezan con mayúscula.</strong></li>
</ul>

<h2 id="la-pantalla-es-un-%C3%A1rbol-de-componentes">La pantalla es un árbol de componentes</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">App
├── Header
├── Filtros
└── section.listado
    ├── Card
    ├── Card
    └── Card
</code></pre>
</div>
<div>
<ul>
<li>Primero se <strong>dibuja la pantalla en cajas</strong>: cada caja que se repite o tiene un nombre propio, es un componente.</li>
<li>Es el mismo árbol que el DOM, pero con <strong>piezas del dominio</strong> en vez de <code>div</code>s.</li>
<li>React ejecuta <code>App()</code>, encuentra <code>&lt;Header /&gt;</code>, ejecuta <code>Header()</code>… hasta llegar a etiquetas HTML.</li>
</ul>
</div>
</div>

<h2 id="pr%C3%A1ctica--ejercicio-21">Práctica · Ejercicio 2.1</h2>
<div class="activity-box">
<p><strong>2.1</strong> · En <code>src/2-componentes/</code>, partir el detalle (ya resuelto en un solo componente) en piezas con props tipadas:</p>
<ul>
<li><code>Encabezado</code> ya resuelto como modelo (título, operación, precio).</li>
<li><code>Atributos</code> (barrio, ambientes, superficies, descripción) y <code>DatosInmobiliaria</code> (nombre, calificación y contacto).</li>
<li>Un <code>Panel</code> con <code>children</code> que envuelve a cada bloque con su título.</li>
<li><code>Detalle</code> solo compone: no le queda JSX &quot;suelto&quot; salvo el layout.</li>
</ul>
</div>

<h2 id="key-la-identidad-de-cada-elemento"><code>key</code>: la identidad de cada elemento</h2>
<ul>
<li>Para reconciliar, React compara la lista nueva con la anterior <strong>elemento por elemento</strong>. La <code>key</code> le dice cuál es cuál.</li>
<li>Tiene que ser <strong>única entre hermanos</strong> y <strong>estable</strong>: el <code>id</code> que viene de la base de datos.</li>
<li>Sin <code>key</code>, la Console avisa: <code>Each child in a list should have a unique &quot;key&quot; prop</code>.</li>
</ul>
<div class="aside-box">
<p>¿Y el índice del <code>map</code> como key? Si la lista se filtra o reordena, el elemento 0 pasa a ser otro: React reutiliza el nodo equivocado (y lo que tuviera adentro, como el texto de un input). Índice solo para listas que nunca cambian.</p>
</div>

<h2 id="una-variable-local-no-alcanza">Una variable local no alcanza</h2>
<ul>
<li>La Console dice 1, 2, 3. El botón sigue en <strong>0</strong>.</li>
<li>Cambiar una variable no le avisa nada a React: <strong>no hay re-render</strong>.</li>
<li>Y aunque lo hubiera: el componente es una función; al volver a ejecutarse, <code>let favoritos = 0</code> arranca de cero.</li>

<p>Hacen falta dos cosas: un valor que <strong>sobreviva</strong> entre ejecuciones, y una forma de <strong>avisar</strong> que cambió.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx">&lt;input

<h2 id="js-plano-y-react-lado-a-lado">JS plano y React, lado a lado</h2>
<table>
<thead>
<tr>
<th>JS plano, a mano</th>
<th>React</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>crearCard(propiedad)</code> devuelve un nodo</td>
<td><code>&lt;Card propiedad={…} /&gt;</code> devuelve JSX</td>
</tr>
<tr>
<td><code>const estado = {…}</code> mutable</td>
<td><code>useState</code>, se reemplaza el valor</td>
</tr>
<tr>
<td>Llamar a <code>render()</code> después de cada cambio</td>
