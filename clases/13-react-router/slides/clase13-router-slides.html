<h2 id="la-clase-pasada">La clase pasada</h2>
<ul>
<li>El estado es una <strong>foto</strong> por render; objetos y arrays se reemplazan, nunca se mutan.</li>
<li>Un dato que comparten dos componentes <strong>sube</strong> al ancestro común.</li>
<li><code>key</code> reinicia el estado de un componente.</li>
<li>Formularios controlados (validación en vivo) o con <code>FormData</code> (al enviar).</li>
<li><code>useRef</code> para tocar el DOM sin re-renderizar.</li>
</ul>

<h2 id="muchas-p%C3%A1ginas-vs-una-sola">Muchas páginas vs. una sola</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">MPA (multi-page)                      SPA (single-page)
────────────────                      ─────────────────
click → GET /detalle.html             click → JS cambia la URL
      ← HTML nuevo, completo                  y dibuja otro componente
      (se pierde todo el estado JS)           (el estado sigue vivo)

     una página por URL                    un index.html para todas
</code></pre>
<ul>
<li>Las páginas de la Clase 10 eran MPA: cada link pide un HTML nuevo.</li>
<li>Una app de React es SPA: hay <strong>un</strong> <code>index.html</code> y JavaScript decide qué mostrar.</li>
<li>El costo: si nadie mira la URL, todo queda en <code>/</code>. Sin links para compartir, sin Atrás, sin F5.</li>
</ul>
</section>

<h2 id="lo-que-hace-un-router">Lo que hace un router</h2>
<ul>
<li><strong>Escucha la URL</strong>: lee <code>location.pathname</code> al arrancar y cada vez que cambia.</li>
<li><strong>Elige qué dibujar</strong>: busca la ruta que coincide y renderiza su componente.</li>
<li><strong>Cambia la URL sin recargar</strong>: usa la History API del navegador (<code>history.pushState</code>).</li>
<li><strong>Atiende Atrás/Adelante</strong>: el navegador avisa, el router vuelve a elegir.</li>
</ul>
<div class="aside-box">
<p>React no trae router propio: <a href="https://reactrouter.com/">React Router</a> es la librería más usada. Desde la v8, todo se importa de <code>react-router</code> (el paquete <code>react-router-dom</code> ya no existe).</p>
</div>
</section>

<h2 id="dos-veces-al-arrancar-y-con-el-a">Dos veces: al arrancar y con el <code>&lt;a&gt;</code></h2>
<ul>
<li>El código de un módulo corre <strong>una vez por carga de la página</strong>.</li>
<li>El <code>&lt;Link&gt;</code> no recarga: el mensaje no se repite.</li>
<li>El <code>&lt;a&gt;</code> pide <code>/como-publicar</code> al servidor: se descarga todo de nuevo y el mensaje vuelve a aparecer.</li>
<li>DevTools → Network lo confirma: el <code>&lt;Link&gt;</code> no genera ningún request.</li>
</ul>
<div class="aside-box">
<p>Todo lo que viva en memoria (estado de React, variables) se pierde con una recarga. Por eso, dentro de la app, siempre <code>&lt;Link&gt;</code>.</p>
</div>

<h2 id="la-p%C3%A1gina-404">La página 404</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">const</span> router = <span class="hljs-title function_">createBrowserRouter</span>([
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Listado</span> /&gt;</span></span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/inmobiliarias&quot;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Inmobiliarias</span> /&gt;</span></span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;*&quot;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">NoEncontrada</span> /&gt;</span></span> }, <span class="hljs-comment">// cualquier otra URL</span>
]);
</code></pre>
<ul>
<li><code>*</code> coincide con cualquier path: el router lo elige <strong>solo si ninguna otra ruta coincide</strong>, sin importar el orden.</li>
<li>Sin una ruta <code>*</code>, el router muestra su pantalla de error por defecto (&quot;404 Not Found&quot;).</li>
<li>En el TPO: una URL vieja o mal escrita tiene que mostrar algo útil, con un link para volver.</li>
</ul>

<h2 id="el-layout-no-se-desmonta">El layout no se desmonta</h2>
<ul>
<li>El texto <strong>queda</strong>: <code>LayoutPublico</code> está en el mismo lugar del árbol antes y después, así que conserva su estado.</li>
<li>Lo que cambia es solo lo que hay <strong>dentro</strong> del <code>&lt;Outlet /&gt;</code>: el listado se desmonta y se monta el detalle.</li>
<li>Es la regla de la Clase 12: el estado está atado a la posición en el árbol.</li>
<li>Consecuencia: lo que tiene que sobrevivir a la navegación vive en el layout (o más arriba); lo de cada página, en la página.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">// /?operacion=Alquiler&amp;q=palermo</span>
<span class="hljs-keyword">const</span> [searchParams, setSearchParams] = <span class="hljs-title function_">useSearchParams</span>();

  <span class="hljs-keyword">const</span> nuevos = <span class="hljs-keyword">new</span> <span class="hljs-title class_">URLSearchParams</span>(searchParams); <span class="hljs-comment">// copia, como en la Clase 12</span>
  <span class="hljs-keyword">if</span> (valor) nuevos.<span class="hljs-title function_">set</span>(clave, valor);
  <span class="hljs-keyword">else</span> nuevos.<span class="hljs-title function_">delete</span>(clave);

}

<span class="hljs-keyword">const</span> visibles = propiedades.<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">p</span>) =&gt;</span> !operacion || p.<span class="hljs-property">operacion</span> === operacion);

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">cambiarFiltro</span>(<span class="hljs-params"><span class="hljs-attr">clave</span>: <span class="hljs-built_in">string</span>, <span class="hljs-attr">valor</span>: <span class="hljs-built_in">string</span>, reemplazar = <span class="hljs-literal">false</span></span>) {

<h2 id="despu%C3%A9s-de-un-submit-replace">Después de un submit, <code>replace</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">sin replace:   /  →  /propiedades/3  →  …/visita  →  /propiedades/3

<ul>
<li>Sin <code>replace</code>, Atrás vuelve al formulario ya enviado: se puede enviar dos veces.</li>

<li>Mismo criterio para el login: después de ingresar, Atrás no tiene que volver al login.</li>
</ul>

<h2 id="la-guardia-es-ux-no-seguridad">La guardia es UX, no seguridad</h2>
<ul>
<li><code>haySesion()</code> mira si hay un token en <code>localStorage</code>: el JWT de la Clase 9.</li>
<li>Cualquiera puede escribir un token falso en DevTools y ver el panel… <strong>vacío</strong>.</li>
<li>Los datos los protege el <strong>backend</strong>: cada request del panel manda el token y la API lo valida (o responde <code>401</code>).</li>
<li>La ruta protegida sirve para que el usuario no llegue a pantallas que no le corresponden y para mandarlo al login en vez de mostrarle errores.</li>
</ul>
</section>

<h2 id="para-tener-en-cuenta-en-el-tpo">Para tener en cuenta en el TPO</h2>
<div class="aside-box">
<ul>
<li><strong>Deploy</strong>: en producción, el servidor tiene que devolver <code>index.html</code> para <strong>cualquier</strong> ruta (si no, F5 en <code>/propiedades/3</code> da 404). <code>npm run dev</code> ya lo hace solo; Vercel, Netlify o un Nginx necesitan una regla de &quot;fallback&quot;.</li>
<li><strong>Otras formas de usar React Router</strong>: el mismo router se puede declarar con JSX (<code>&lt;BrowserRouter&gt;</code> + <code>&lt;Routes&gt;</code>), y también puede cargar datos por ruta (<code>loader</code>).</li>
</ul>
</div>

<h2 id="recap">Recap</h2>
<ul>
<li>Una SPA cambia la URL <strong>sin recargar</strong>: <code>createBrowserRouter</code> + <code>&lt;RouterProvider&gt;</code>, y <code>&lt;Link&gt;</code> en vez de <code>&lt;a&gt;</code>.</li>
<li><code>:id</code> + <code>useParams()</code> para una ruta por recurso; el dato puede no existir.</li>
<li>Layouts con <code>children</code> + <code>&lt;Outlet /&gt;</code>: el marco se escribe una vez y no se desmonta. <code>NavLink</code> sabe si está activo.</li>
<li>Lo que se comparte o sobrevive a F5 va en la URL: <code>useSearchParams</code>. <code>navigate()</code> cuando decide el código; <code>replace</code> después de un submit.</li>
<li>Rutas protegidas con un guardia y <code>&lt;Navigate&gt;</code>: es UX, la seguridad está en el backend.</li>
</ul>
</section>
