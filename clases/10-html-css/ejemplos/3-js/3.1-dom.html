<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3.1 · Leer y modificar el DOM</title>
    <link rel="stylesheet" href="estilos.css" />
    <!-- defer: el script corre cuando el HTML ya está parseado (el DOM existe) -->
    <script src="3.1-dom.js" defer></script>
  </head>
  <body>
    <header class="header">
      <strong>🏠 Inmobi</strong>
      <span id="titulo-listado">Propiedades</span>
    </header>

    <main class="contenido">
      <section class="listado" id="listado">
        <article class="card" data-id="1">
          <img src="https://picsum.photos/seed/prop1/400/260" alt="Departamento luminoso con balcón" />
          <div class="card-body">
            <div class="card-precio">
              <strong class="precio">ARS 650.000</strong>
              <span class="badge">Alquiler</span>
            </div>
            <h2>Departamento luminoso con balcón</h2>
            <p>Palermo · 3 amb. · 68 m²</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
