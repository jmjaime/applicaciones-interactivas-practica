<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Relación 1 a N: Authors → Books</title>
  <desc id="desc">Diagrama con tablas AUTHORS y BOOKS mostrando columnas y filas, con flechas desde authors.id hacia múltiples filas de books.author_id.</desc>
  <defs>
    <style>
      .table { fill: #21222c; stroke-width: 2; rx: 10; ry: 10; }
      .table-authors { stroke: #8be9fd; }
      .table-books { stroke: #bd93f9; }
      .header-authors { fill: #8be9fd; }
      .header-books { fill: #bd93f9; }
      .header-text { fill: #282a36; font-family: Inter, Segoe UI, Roboto, sans-serif; font-weight: 700; font-size: 24px; }
      .col-label { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-weight: 700; font-size: 20px; }
      .cell-text { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-size: 20px; }
      .grid { stroke: #44475a; stroke-width: 1; }
      .arrow { stroke: #8be9fd; stroke-width: 4; fill: none; }
      .legend { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-size: 18px; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#8be9fd" />
    </marker>
  </defs>

  <!-- AUTHORS table -->
  <rect x="24" y="24" width="400" height="204" class="table table-authors" />
  <rect x="24" y="24" width="400" height="54" class="header header-authors" />
  <text x="44" y="59" class="header-text">AUTHORS</text>

  <line x1="24" y1="78" x2="424" y2="78" class="grid" />
  <text x="44" y="110" class="col-label">id (PK)</text>
  <text x="160" y="110" class="col-label">name</text>

  <line x1="24" y1="128" x2="424" y2="128" class="grid" />
  <text x="44" y="160" class="cell-text">1</text>
  <text x="160" y="160" class="cell-text">Juan Pérez</text>

  <line x1="24" y1="178" x2="424" y2="178" class="grid" />
  <text x="44" y="210" class="cell-text">2</text>
  <text x="160" y="210" class="cell-text">María García</text>

  <!-- BOOKS table -->
  <rect x="476" y="24" width="400" height="254" class="table table-books" />
  <rect x="476" y="24" width="400" height="54" class="header header-books" />
  <text x="496" y="59" class="header-text">BOOKS</text>

  <line x1="476" y1="78" x2="876" y2="78" class="grid" />
  <text x="496" y="110" class="col-label">id (PK)</text>
  <text x="600" y="110" class="col-label">author_id</text>
  <text x="770" y="110" class="col-label">title</text>

  <line x1="476" y1="128" x2="876" y2="128" class="grid" />
  <text x="496" y="160" class="cell-text">100</text>
  <text x="620" y="160" class="cell-text">1</text>
  <text x="770" y="160" class="cell-text">Libro A</text>

  <line x1="476" y1="178" x2="876" y2="178" class="grid" />
  <text x="496" y="210" class="cell-text">101</text>
  <text x="620" y="210" class="cell-text">1</text>
  <text x="770" y="210" class="cell-text">Libro B</text>

  <line x1="476" y1="228" x2="876" y2="228" class="grid" />
  <text x="496" y="260" class="cell-text">102</text>
  <text x="620" y="260" class="cell-text">2</text>
  <text x="770" y="260" class="cell-text">Libro C</text>

  <!-- Arrows from author 1 to books 100 and 101 -->
  <path d="M 424 135 C 480 40, 560 40, 605 152" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 424 155 C 460 235, 560 235, 605 205" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Legend -->
  <text x="24" y="360" class="legend"><tspan font-weight="700" fill="#50fa7b">Relación 1:N</tspan> — un autor puede tener muchos libros.</text>
</svg>
