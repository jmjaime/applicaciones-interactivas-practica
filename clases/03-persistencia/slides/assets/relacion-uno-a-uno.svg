<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Relación 1 a 1: Users ↔ Profile</title>
  <desc id="desc">Diagrama con dos tablas USERS y PROFILE mostrando columnas y filas de ejemplo, con una flecha desde users.id a profile.user_id.</desc>
  <defs>
    <style>
      .table { fill: #21222c; stroke-width: 2; rx: 10; ry: 10; }
      .table-users { stroke: #8be9fd; }
      .table-profile { stroke: #bd93f9; }
      .header-users { fill: #8be9fd; }
      .header-profile { fill: #bd93f9; }
      .header-text { fill: #282a36; font-family: Inter, Segoe UI, Roboto, sans-serif; font-weight: 700; font-size: 24px; }
      .col-label { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-weight: 700; font-size: 20px; }
      .cell-text { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-size: 20px; }
      .grid { stroke: #44475a; stroke-width: 1; }
      .arrow { stroke: #8be9fd; stroke-width: 4; fill: none; }
      .legend { fill: #f8f8f2; font-family: Inter, Segoe UI, Roboto, sans-serif; font-size: 18px; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#8be9fd" />
    </marker>
  </defs>

  <!-- USERS table -->
  <rect x="24" y="24" width="400" height="204" class="table table-users" />
  <rect x="24" y="24" width="400" height="54" class="header header-users" />
  <text x="44" y="59" class="header-text">USERS</text>

  <line x1="24" y1="78" x2="424" y2="78" class="grid" />
  <text x="44" y="110" class="col-label">id (PK)</text>
  <text x="160" y="110" class="col-label">email</text>

  <line x1="24" y1="128" x2="424" y2="128" class="grid" />
  <text x="44" y="160" class="cell-text">1</text>
  <text x="160" y="160" class="cell-text">juan@mail.com</text>

  <line x1="24" y1="178" x2="424" y2="178" class="grid" />
  <text x="44" y="210" class="cell-text">2</text>
  <text x="160" y="210" class="cell-text">maria@mail.com</text>

  <!-- PROFILE table -->
  <rect x="476" y="170" width="400" height="204" class="table table-profile" />
  <rect x="476" y="170" width="400" height="54" class="header header-profile" />
  <text x="496" y="205" class="header-text">PROFILE</text>

  <line x1="476" y1="224" x2="876" y2="224" class="grid" />
  <text x="496" y="256" class="col-label">id (PK)</text>
  <text x="596" y="256" class="col-label">user_id (FK)</text>
  <text x="780" y="256" class="col-label">bio</text>

  <line x1="476" y1="274" x2="876" y2="274" class="grid" />
  <text x="496" y="306" class="cell-text">101</text>
  <text x="626" y="306" class="cell-text">1</text>
  <text x="780" y="306" class="cell-text">Bio Juan</text>

  <line x1="476" y1="324" x2="876" y2="324" class="grid" />
  <text x="496" y="356" class="cell-text">102</text>
  <text x="626" y="356" class="cell-text">2</text>
  <text x="780" y="356" class="cell-text">Bio María</text>

  <!-- Arrow from users.id (row1) to profile.user_id (row1) -->
  <path d="M 424 140 C 445 250, 460 260, 620 306" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Legend -->
  <text x="24" y="404" class="legend"><tspan font-weight="700" fill="#50fa7b">Relación 1:1</tspan> — cada usuario tiene un perfil y cada perfil pertenece a un único usuario.</text>
</svg>
