<h2 id="estado-de-la-aplicaci%C3%B3n">Estado de la aplicación</h2>
<p>Una aplicación corriendo acumula distintos tipos de estado en memoria:</p>
<ul>
<li><strong>Datos del negocio</strong>: usuarios, productos, pedidos</li>
<li><strong>Configuración</strong>: feature flags, límites, credenciales</li>
<li><strong>Métricas</strong>: requests/seg, tiempo de respuesta</li>
<li><strong>Logs</strong>: accesos, cambios, auditoría</li>
<li><strong>Errores</strong>: excepciones no manejadas, fallos de validación</li>
</ul>
<p>Todo esto vive en RAM mientras el proceso corre, y se pierde si se reinicia.</p>
</section>

<h2 id="local-vs-remoto">Local vs Remoto</h2>
<table>
<thead>
<tr>
<th>Aspecto</th>
<th>Local</th>
<th>Remoto</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Escalabilidad</strong></td>
<td>Limitada por hardware físico</td>
<td>Horizontal (más servidores, cloud)</td>
</tr>
<tr>
<td><strong>Acceso</strong></td>
<td>Directo al sistema de archivos</td>
<td>Vía red (HTTP/TCP/IP), multi-cliente</td>
</tr>
<tr>
<td><strong>Latencia</strong></td>
<td>~0.1ms</td>
<td>~50-200ms (red, distancia, carga)</td>
</tr>
</tbody>
</table>
<p><strong>Ejemplo:</strong> Una app móvil con SQLite está limitada por el storage del teléfono vs. una API con PostgreSQL que puede agregar más servidores según demanda.</p>
</section>

<h2 id="acid">ACID</h2>
<ul>
<li><strong>Atomicidad</strong> → La operación se aplica completa o no se aplica</li>
<li><strong>Consistencia</strong> → Los datos siempre quedan en un estado válido</li>
<li><strong>Aislamiento</strong> → Las transacciones concurrentes no se interfieren entre sí</li>
<li><strong>Durabilidad</strong> → Los cambios confirmados persisten permanentemente</li>
</ul>

<h2 id="entidad">Entidad</h2>
<ul>
<li>Camila sigue siendo &quot;la misma&quot; aunque cambie su número de teléfono — la identifica su <strong>id</strong> (23), no sus atributos</li>
<li>Ese es el criterio de una <strong>Entidad</strong>: identidad propia y persistente</li>
<li><strong>Mutable</strong>: sus atributos pueden cambiar y sigue siendo la misma entidad</li>
<li><strong>Igualdad por identidad</strong>: dos entidades son iguales si tienen el mismo id, aunque difieran en otros atributos</li>
</ul>
</section>

<h2 id="value-object">Value Object</h2>
<ul>
<li>Dos números de teléfono iguales son el mismo dato — no hay &quot;el&quot; teléfono con identidad propia, solo un valor que se compara</li>
<li>Ese es el criterio de un <strong>Value Object</strong>: sin id propio</li>
<li><strong>Inmutable</strong>: para &quot;cambiarlo&quot; se crea uno nuevo, no se modifica in-place</li>
<li><strong>Igualdad por valor</strong>: dos Value Objects son iguales si todos sus atributos son iguales</li>
<li>Ejemplo que vamos a retomar: <code>Money { value, currency }</code></li>
</ul>
</section>

<h3 id="sql-clase-%E2%86%92-tabla--insert-y-select">SQL Clase → Tabla · Insert y Select</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Insert</span>
<span class="hljs-keyword">INSERT INTO</span> person (id, name, last_name, age)
<span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-string">&#x27;Juan&#x27;</span>, <span class="hljs-string">&#x27;Pérez&#x27;</span>, <span class="hljs-number">25</span>);

<span class="hljs-comment">-- Select (mapear a objeto Person)</span>
<span class="hljs-keyword">SELECT</span>
  id,
  name,
  last_name <span class="hljs-keyword">AS</span> lastName,

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Insert</span>

<span class="hljs-comment">-- Select (usuario con perfil)</span>

<h3 id="sql-1n--insert-y-select">SQL 1:N · Insert y Select</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Insert</span>
<span class="hljs-keyword">INSERT INTO</span> authors (id, name) <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-string">&#x27;Juan Pérez&#x27;</span>);
<span class="hljs-keyword">INSERT INTO</span> books (id, author_id, title) <span class="hljs-keyword">VALUES</span>
  (<span class="hljs-number">100</span>, <span class="hljs-number">1</span>, <span class="hljs-string">&#x27;Libro A&#x27;</span>),
  (<span class="hljs-number">101</span>, <span class="hljs-number">1</span>, <span class="hljs-string">&#x27;Libro B&#x27;</span>);

<span class="hljs-keyword">SELECT</span> b.id, b.author_id, b.title
<span class="hljs-keyword">FROM</span> books b
<span class="hljs-keyword">WHERE</span> b.author_id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-keyword">SELECT</span> a.id <span class="hljs-keyword">AS</span> author_id, a.name <span class="hljs-keyword">AS</span> author_name,
       b.id <span class="hljs-keyword">AS</span> book_id, b.title
<span class="hljs-keyword">FROM</span> authors a
<span class="hljs-keyword">JOIN</span> books b <span class="hljs-keyword">ON</span> b.author_id <span class="hljs-operator">=</span> a.id
<span class="hljs-keyword">WHERE</span> a.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>

<h2 id="relaciones--n1">Relaciones · N:1</h2>
<p>Es la <strong>misma relación</strong> que 1:N, vista desde el lado &quot;muchos&quot;: <code>Employee</code> → <code>Department</code> es el mismo mecanismo de FK que <code>Author</code> → <code>Books</code>, solo que la consulta parte del lado hijo.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> e.name <span class="hljs-keyword">AS</span> employee, d.name <span class="hljs-keyword">AS</span> department
<span class="hljs-keyword">FROM</span> employees e
<span class="hljs-keyword">JOIN</span> departments d <span class="hljs-keyword">ON</span> e.department_id <span class="hljs-operator">=</span> d.id
<span class="hljs-keyword">WHERE</span> e.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p><strong>El mapeo es igual</strong>: la fila del JOIN arma el objeto anidado (<code>employee.department</code>).</p>

<h2 id="herencia--una-tabla-para-toda-la-jerarqu%C3%ADa-tph">Herencia · Una tabla para toda la jerarquía (TPH)</h2>
<p><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Una Entidad con subtipos. Ya vimos cómo una Entidad<br />
referencia a otra (Relaciones) — la herencia es el caso donde, además, esa<br />
Entidad tiene subtipos.</p>
<p>→ Todas las clases de la jerarquía en una sola tabla con columnas para todos los atributos</p>
<p><strong>Pros:</strong> Consultas simples, alto rendimiento, sin JOINs<br />
<strong>Contras:</strong> Muchas columnas NULL, desperdicio de espacio, pérdida de integridad referencial</p>

<h3 id="ejemplo-polim%C3%B3rfico-tpc--insert-y-select">Ejemplo polimórfico (TPC) · Insert y Select</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-typescript"><span class="hljs-comment">// INSERT polimórfico (TPC)</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">insertVehicleTPC</span>(<span class="hljs-params"><span class="hljs-attr">db</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">v</span>: <span class="hljs-title class_">Vehicle</span></span>) {
  <span class="hljs-keyword">if</span> (v.<span class="hljs-property">type</span> === <span class="hljs-string">&quot;auto&quot;</span>) {
    db.<span class="hljs-title function_">prepare</span>(
      <span class="hljs-string">&quot;INSERT INTO auto (id, marca, modelo, puertas) VALUES (?, ?, ?, ?)&quot;</span>
    ).<span class="hljs-title function_">run</span>(
      ...<span class="hljs-title function_">autoToInsertParams</span>({
        <span class="hljs-attr">id</span>: v.<span class="hljs-property">id</span>,
        <span class="hljs-attr">marca</span>: v.<span class="hljs-property">marca</span>,
        <span class="hljs-attr">modelo</span>: v.<span class="hljs-property">modelo</span>,
        <span class="hljs-attr">puertas</span>: v.<span class="hljs-property">puertas</span>,
      })
    );
  } <span class="hljs-keyword">else</span> {
    db.<span class="hljs-title function_">prepare</span>(
      <span class="hljs-string">&quot;INSERT INTO moto (id, marca, modelo, cilindrada) VALUES (?, ?, ?, ?)&quot;</span>
    ).<span class="hljs-title function_">run</span>(
      ...<span class="hljs-title function_">motoToInsertParams</span>({
        <span class="hljs-attr">id</span>: v.<span class="hljs-property">id</span>,
        <span class="hljs-attr">marca</span>: v.<span class="hljs-property">marca</span>,
        <span class="hljs-attr">modelo</span>: v.<span class="hljs-property">modelo</span>,
        <span class="hljs-attr">cilindrada</span>: v.<span class="hljs-property">cilindrada</span>,
      })
    );
  }
}

<span class="hljs-comment">// SELECT polimórfico (TPC)</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">selectVehiclesTPC</span>(<span class="hljs-params"><span class="hljs-attr">db</span>: <span class="hljs-built_in">any</span></span>): <span class="hljs-title class_">Vehicle</span>[] {
  <span class="hljs-keyword">const</span> rows = db
    .<span class="hljs-title function_">prepare</span>(
      <span class="hljs-string">&quot;SELECT id, marca, modelo, &#x27;auto&#x27; AS type, puertas, NULL AS cilindrada FROM auto\n&quot;</span> +
        <span class="hljs-string">&quot;UNION ALL\n&quot;</span> +
        <span class="hljs-string">&quot;SELECT id, marca, modelo, &#x27;moto&#x27; AS type, NULL AS puertas, cilindrada FROM moto&quot;</span>
    )
    .<span class="hljs-title function_">all</span>();
  <span class="hljs-keyword">return</span> rows.<span class="hljs-title function_">map</span>(mapRowToVehicle);
}

<h2 id="herencia--tabla-base--especializaciones-joined">Herencia · Tabla base + especializaciones (JOINED)</h2>
<p>→ Tabla base con atributos comunes + tablas separadas para atributos específicos de cada subclase — en el fondo, la misma relación 1:1 que ya vimos, aplicada sistemáticamente entre la tabla base y cada especialización</p>
<p><strong>Pros:</strong> Normalización correcta, sin duplicación, integridad referencial<br />
<strong>Contras:</strong> Requiere JOINs, consultas más complejas, menor rendimiento</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Insert</span>

  (<span class="hljs-number">2</span>, <span class="hljs-string">&#x27;Yamaha&#x27;</span>, <span class="hljs-string">&#x27;MT-07&#x27;</span>);
<span class="hljs-keyword">INSERT INTO</span> auto (id, puertas) <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-number">4</span>);
<span class="hljs-keyword">INSERT INTO</span> moto (id, cilindrada) <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">2</span>, <span class="hljs-number">689</span>);

<span class="hljs-comment">-- Select (auto con base)</span>
<span class="hljs-comment">-- Select (polimórfico)</span>
<span class="hljs-keyword">SELECT</span> v.id, v.marca, v.modelo, a.puertas, <span class="hljs-keyword">NULL</span> <span class="hljs-keyword">AS</span> cilindrada
<span class="hljs-keyword">FROM</span> vehicle v
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> auto a <span class="hljs-keyword">ON</span> a.id <span class="hljs-operator">=</span> v.id
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> v.id, v.marca, v.modelo, <span class="hljs-keyword">NULL</span> <span class="hljs-keyword">AS</span> puertas, m.cilindrada
<span class="hljs-keyword">FROM</span> vehicle v
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> moto m <span class="hljs-keyword">ON</span> m.id <span class="hljs-operator">=</span> v.id;

}

<span class="hljs-comment">// SELECT polimórfico (JOINED)</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">selectVehiclesJOINED</span>(<span class="hljs-params"><span class="hljs-attr">db</span>: <span class="hljs-built_in">any</span></span>): <span class="hljs-title class_">Vehicle</span>[] {

<h2 id="value-objects--objetos-embebidos">Value Objects · objetos embebidos</h2>
<p><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Un Value Object: sin tabla propia, se embebe en la Entidad que lo contiene. Volvemos a <code>Money</code>, el ejemplo de la slide de Value Object.</p>
<p>Un Value Object anidado en la clase se puede mapear de varias formas:</p>
<ul>
<li><strong>Composición estática</strong>: se &quot;aplana&quot; en columnas de la tabla principal (ej. <code>price_value</code>, <code>price_currency</code>)</li>
<li><strong>JSON</strong>: se serializa en una sola columna (ej. <code>price_json</code>)</li>
<li><strong>Colección de tipos simples</strong>: CSV en una columna, o array serializado en JSON</li>
</ul>

<h2 id="objetos-anidados--embebidos--trade-offs">Objetos anidados / embebidos · Trade-offs</h2>
<table>
<thead>
<tr>
<th>Dimensión</th>
<th>Aplanado (columnas)</th>
<th>JSON</th>
<th>CSV (colección simple)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Lectura</strong></td>
<td>SQL directo, por campo</td>
<td>Funciones JSON del motor</td>
<td>Parsear en la app</td>
</tr>
<tr>
<td><strong>Validación</strong></td>
<td>Constraints nativos</td>
<td>Débil, sin schema</td>
<td>Ninguna</td>
</tr>
<tr>
<td><strong>Performance</strong></td>
<td>Indexable por campo</td>
<td>Depende del soporte JSON</td>
<td>Mala para buscar un elemento</td>
</tr>
<tr>
<td><strong>Complejidad</strong></td>
<td>Duplica si se repite el VO</td>
<td>Preserva estructura fácil</td>
<td>Simple de escribir, pobre de leer</td>
</tr>
</tbody>
</table>

<h2 id="conexi%C3%B3n-de-la-aplicaci%C3%B3n-a-la-base-de-datos">Conexión de la aplicación a la base de datos</h2>
<ul>
<li>La app se conecta a través de un driver/cliente (ej. <code>pg</code>, <code>better-sqlite3</code>) — no habla el protocolo de la base de datos directamente</li>
<li>Abrir una conexión es costoso (handshake, autenticación, TCP) — no se abre una por cada query</li>
</ul>
</section>

<h2 id="pool-de-conexiones-y-transacciones">Pool de conexiones y Transacciones</h2>
<ul>
<li><strong>Pool de conexiones</strong>: conexiones ya abiertas y reutilizables — la app pide una prestada, la usa, la devuelve, en vez de abrir/cerrar todo el tiempo</li>
<li><strong>Transacción</strong>: <code>BEGIN</code> → varias operaciones → <code>COMMIT</code> (o <code>ROLLBACK</code> si algo falla) — una conexión en transacción no vuelve al pool hasta terminar</li>
<li>Ejemplo: transferir dinero entre cuentas — débito y crédito tienen que ser atómicos (esto es lo que ya vimos que garantiza ACID)</li>
</ul>
</section>
