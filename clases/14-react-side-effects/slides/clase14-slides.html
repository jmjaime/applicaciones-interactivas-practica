<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">Precio</span>(<span class="hljs-params">{ valor, moneda }: <span class="hljs-title class_">PrecioProps</span></span>) {

<ul>
<li>React espera componentes <strong>puros</strong>: mismas props y estado, mismo JSX.</li>

<li>Una función pura es predecible.</li>

<h2 id="side-effect-lo-que-toca-el-mundo-de-afuera">Side effect: lo que toca el mundo de afuera</h2>
<p>Todo lo que no es calcular el JSX:</p>
<ul>
<li><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f310.svg" data-marp-twemoji=""/> <strong>Red</strong>: <code>fetch</code> a una API.</li>
<li><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4be.svg" data-marp-twemoji=""/> <strong>Almacenamiento</strong>: <code>localStorage</code>.</li>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/23f1.svg" data-marp-twemoji=""/> <strong>Tiempo</strong>: <code>setTimeout</code>, <code>setInterval</code>.</li>
<li><img class="emoji" draggable="false" alt="🖱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5b1.svg" data-marp-twemoji=""/> <strong>Suscripciones</strong>: <code>addEventListener</code>, WebSockets.</li>
<li><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3f7.svg" data-marp-twemoji=""/> <strong>El DOM fuera de React</strong>: <code>document.title</code>, <code>focus()</code>.</li>
</ul>
<p>Una app sin side effects no serviría de mucho: el punto es que no ocurran <strong>durante el render</strong>.</p>

<h2 id="no-termina-nunca">No termina nunca</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">render → fetch → llega la respuesta → setPropiedades(array nuevo)
  ↑                                              │
  └────────────── otro render ←──────────────────┘
</code></pre>
<ul>
<li>El cuerpo del componente corre en <strong>cada</strong> render.</li>
<li>Cada respuesta es un array nuevo: React lo ve distinto y vuelve a renderizar.</li>
<li>En producción, cada usuario con la página abierta envía requests a la API de forma ininterrumpida.</li>
</ul>
</section>

<tr>

<h2 id="tres-detalles-de-ese-c%C3%B3digo">Tres detalles de ese código</h2>
<ul>
<li><strong>La función del effect no puede ser <code>async</code></strong>: tiene que devolver nada o un cleanup, no una promesa. Por eso hay una función <code>async</code> adentro.</li>
<li><strong><code>fetch</code> no falla con un 404 ni con un 500</strong>: solo rechaza si no hubo respuesta. Hay que mirar <code>res.ok</code>.</li>
<li><strong>Una carga tiene varios finales posibles</strong>: cargando, error, vacío o con datos. Cada uno se dibuja distinto.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">if</span> (cargando) <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Cargando…<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>;

<h2 id="%C2%BFdos-requests">¿Dos requests?</h2>
<p>Con <code>&lt;StrictMode&gt;</code> en desarrollo, Network muestra <strong>dos</strong> <code>GET</code> al abrir la pantalla.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">monta → corre el effect → desmonta (cleanup) → monta → corre el effect
</code></pre>
<ul>
<li>No es un bug: React lo hace a propósito, <strong>solo en desarrollo</strong>, para que aparezcan a tiempo los effects sin cleanup.</li>
<li>En producción (<code>npm run build</code>) es un solo request.</li>
<li>Dos y ahí termina es lo normal. Una lista que sigue creciendo, no.</li>
</ul>

<h2 id="rules-of-hooks">Rules of Hooks</h2>
<p>Valen para <code>useState</code>, <code>useEffect</code>, <code>useRef</code> y <code>useActionState</code>:</p>
<ol>
<li><strong>Solo en el nivel superior del componente</strong>: nunca adentro de un <code>if</code>, un <code>for</code> o un handler.</li>
<li><strong>Solo en componentes</strong> (o en otros hooks).</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">cargar</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* usa id */</span> }

<h2 id="pr%C3%A1ctica--ejercicio-2">Práctica · Ejercicio 2</h2>
<div class="activity-box">
<p>En <code>ejercicios/src/2-dependencias/</code> (<code>/2/</code>): <strong>Filtros y detalle</strong>.</p>
<ul>
<li>El detalle trae la propiedad y sus visitas en dos effects, cancelando los requests anteriores. Un id inexistente muestra un mensaje.</li>
<li>Los chips de estado y la búsqueda pasan a filtrar en la API.</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">const</span> [pendiente, setPendiente] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">false</span>);

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">handleSubmit</span>(<span class="hljs-params"><span class="hljs-attr">e</span>: <span class="hljs-title class_">React</span>.<span class="hljs-title class_">FormEvent</span>&lt;<span class="hljs-title class_">HTMLFormElement</span>&gt;</span>) {
  e.<span class="hljs-title function_">preventDefault</span>();
  <span class="hljs-title function_">setPendiente</span>(<span class="hljs-literal">true</span>);

<h2 id="react-resetea-el-form">React resetea el form</h2>
<ul>
<li>Al terminar la action, React <strong>resetea los campos no controlados</strong>, también si la API devolvió un error.</li>
<li>Cada campo vuelve a su <code>defaultValue</code>: por eso la action devuelve <code>valores</code>, y el input usa <code>defaultValue={estado.valores.nombre}</code>.</li>
<li>Un <code>&lt;select&gt;</code> no toma un <code>defaultValue</code> nuevo sin remontarse:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx">&lt;select key={estado.<span class="hljs-property">valores</span>.<span class="hljs-property">tipo</span>} name=<span class="hljs-string">&quot;tipo&quot;</span> defaultValue={estado.<span class="hljs-property">valores</span>.<span class="hljs-property">tipo</span>}&gt;
</code></pre>
<div class="aside-box">
<p>Validar en el front da feedback inmediato (Clase 12), pero quien decide es el backend: sus errores también hay que mostrarlos.</p>
</div>

<h2 id="recap">Recap</h2>
<ul>
<li>Renderizar es calcular: los side effects van en un <strong>handler</strong> o en un <strong>effect</strong>.</li>
<li><code>useEffect</code> corre después del render. Las dependencias dicen cuándo repetirlo, y no se eligen.</li>
<li>Cada carga tiene sus estados: cargando, error, vacío y datos. <code>fetch</code> no falla con un 404.</li>
<li><strong>Cleanup</strong>: <code>abort()</code> para los requests, <code>clearInterval</code>, <code>removeEventListener</code>.</li>
<li>Antes de escribir un effect: ¿se puede calcular? ¿Ocurre por un evento?</li>
<li>Escribir datos: <code>&lt;form action&gt;</code> y <code>useActionState</code>, con los errores del backend.</li>
</ul>
</section>
